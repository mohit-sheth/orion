tests:
  - name: maas-gateway-perf
    metadata:
      platform: AWS
      clusterType: self-managed
      masterNodesType: m6a.xlarge
      masterNodesCount: 3
      workerNodesType: m6i.2xlarge
      workerNodesCount: 3
      benchmark.keyword: maas-gateway-perf
      wildcard:
        ocpVersion: "{{ version }}*"
      networkType: OVNKubernetes
      jobType: "{{ jobtype | default('periodic') }}"
      pullNumber: "{{ pull_number | default(0) }}"
      organization: "{{ organization | default('') }}"
      repository: "{{ repository | default('') }}"
      fips: "{{ fips | default('false') }}"
      not:
        stream: okd

    metrics:
      # Container CPU + Memory across all MaaS component namespaces.
      # fan_out expands the 8 metricNames at config-load time;
      # group_by discovers containers from OpenSearch at run time.
      - name: ${job}-${mn}-${labels.container.keyword}
        metricName.keyword: ${mn}
        jobName: ${job}
        metric_of_interest: value
        group_by:
          - labels.container.keyword
        agg:
          agg_type: avg
        direction: 1
        threshold: 10
        fan_out:
          - mn: maasContainerCPU
            job: gateway-small-gpt-4o-openai-c8
          - mn: kuadrantContainerCPU
            job: gateway-small-gpt-4o-openai-c8
          - mn: testInfraContainerCPU
            job: gateway-small-gpt-4o-openai-c8
          - mn: maasAPIContainerCPU
            job: gateway-small-gpt-4o-openai-c8
          - mn: maasContainerMemory
            job: gateway-small-gpt-4o-openai-c8
          - mn: kuadrantContainerMemory
            job: gateway-small-gpt-4o-openai-c8
          - mn: testInfraContainerMemory
            job: gateway-small-gpt-4o-openai-c8
          - mn: maasAPIContainerMemory
            job: gateway-small-gpt-4o-openai-c8
          - mn: maasContainerCPU
            job: baseline-small-gpt-4o-openai-c8
          - mn: kuadrantContainerCPU
            job: baseline-small-gpt-4o-openai-c8
          - mn: testInfraContainerCPU
            job: baseline-small-gpt-4o-openai-c8
          - mn: maasAPIContainerCPU
            job: baseline-small-gpt-4o-openai-c8
          - mn: maasContainerMemory
            job: baseline-small-gpt-4o-openai-c8
          - mn: kuadrantContainerMemory
            job: baseline-small-gpt-4o-openai-c8
          - mn: testInfraContainerMemory
            job: baseline-small-gpt-4o-openai-c8
          - mn: maasAPIContainerMemory
            job: baseline-small-gpt-4o-openai-c8

      # Network receive / transmit for MaaS ingress components
      - name: ${job}-maasNetwork${dir}Rate
        metricName.keyword: maasNetwork${dir}Rate
        jobName: ${job}
        metric_of_interest: value
        agg:
          agg_type: avg
        direction: 0
        fan_out:
          - dir: Receive
            job: gateway-small-gpt-4o-openai-c8
          - dir: Transmit
            job: gateway-small-gpt-4o-openai-c8
          - dir: Receive
            job: baseline-small-gpt-4o-openai-c8
          - dir: Transmit
            job: baseline-small-gpt-4o-openai-c8

      # Istio/Envoy gateway request duration percentiles
      - name: ${job}-gatewayRequestDuration${pct}
        metricName.keyword: gatewayRequestDuration${pct}
        jobName: ${job}
        metric_of_interest: value
        agg:
          agg_type: avg
        direction: 1
        threshold: 10
        fan_out:
          - pct: P50
            job: gateway-small-gpt-4o-openai-c8
          - pct: P95
            job: gateway-small-gpt-4o-openai-c8
          - pct: P99
            job: gateway-small-gpt-4o-openai-c8
          - pct: P50
            job: baseline-small-gpt-4o-openai-c8
          - pct: P95
            job: baseline-small-gpt-4o-openai-c8
          - pct: P99
            job: baseline-small-gpt-4o-openai-c8

      # Istio gateway request rate (per response code)
      - name: ${job}-gatewayRequestRate
        metricName.keyword: gatewayRequestRate
        jobName: ${job}
        metric_of_interest: value
        agg:
          agg_type: avg
        direction: 0
        fan_out:
          - job: gateway-small-gpt-4o-openai-c8
          - job: baseline-small-gpt-4o-openai-c8

      # Istio gateway cumulative request count
      - name: ${job}-gatewayRequestCount
        metricName.keyword: gatewayRequestCount
        jobName: ${job}
        metric_of_interest: value
        agg:
          agg_type: max
        direction: 0
        fan_out:
          - job: gateway-small-gpt-4o-openai-c8
          - job: baseline-small-gpt-4o-openai-c8

      # Limitador authorized calls gauge
      - name: ${job}-limitadorAuthorizedCalls
        metricName.keyword: limitadorAuthorizedCalls
        jobName: ${job}
        metric_of_interest: value
        agg:
          agg_type: avg
        direction: 0
        fan_out:
          - job: gateway-small-gpt-4o-openai-c8
          - job: baseline-small-gpt-4o-openai-c8

      # Limitador authorized hits rate
      - name: ${job}-limitadorAuthorizedHitsRate
        metricName.keyword: limitadorAuthorizedHitsRate
        jobName: ${job}
        metric_of_interest: value
        agg:
          agg_type: avg
        direction: 1
        fan_out:
          - job: gateway-small-gpt-4o-openai-c8
          - job: baseline-small-gpt-4o-openai-c8

      # guidellm benchmark: TTFT - Time to First Token (lower is better)
      - name: ${job}-ttft-${pct}
        metricName.keyword: guidellmBenchmarkSummary
        job_name.keyword: ${job}
        metric_of_interest: ttft_${pct}_ms
        agg:
          agg_type: avg
        direction: 1
        threshold: 10
        fan_out:
          - pct: mean
            job: gateway-small-gpt-4o-openai-c8
          - pct: p90
            job: gateway-small-gpt-4o-openai-c8
          - pct: p95
            job: gateway-small-gpt-4o-openai-c8
          - pct: p99
            job: gateway-small-gpt-4o-openai-c8
          - pct: mean
            job: baseline-small-gpt-4o-openai-c8
          - pct: p90
            job: baseline-small-gpt-4o-openai-c8
          - pct: p95
            job: baseline-small-gpt-4o-openai-c8
          - pct: p99
            job: baseline-small-gpt-4o-openai-c8

      # guidellm benchmark: ITL - Inter-Token Latency (lower is better)
      - name: ${job}-itl-${pct}
        metricName.keyword: guidellmBenchmarkSummary
        job_name.keyword: ${job}
        metric_of_interest: itl_${pct}_ms
        agg:
          agg_type: avg
        direction: 1
        threshold: 10
        fan_out:
          - pct: mean
            job: gateway-small-gpt-4o-openai-c8
          - pct: p90
            job: gateway-small-gpt-4o-openai-c8
          - pct: p95
            job: gateway-small-gpt-4o-openai-c8
          - pct: p99
            job: gateway-small-gpt-4o-openai-c8
          - pct: mean
            job: baseline-small-gpt-4o-openai-c8
          - pct: p90
            job: baseline-small-gpt-4o-openai-c8
          - pct: p95
            job: baseline-small-gpt-4o-openai-c8
          - pct: p99
            job: baseline-small-gpt-4o-openai-c8

      # guidellm benchmark: TPOT - Time Per Output Token (lower is better)
      - name: ${job}-tpot-${pct}
        metricName.keyword: guidellmBenchmarkSummary
        job_name.keyword: ${job}
        metric_of_interest: time_per_output_token_${pct}_ms
        agg:
          agg_type: avg
        direction: 1
        threshold: 10
        fan_out:
          - pct: mean
            job: gateway-small-gpt-4o-openai-c8
          - pct: p90
            job: gateway-small-gpt-4o-openai-c8
          - pct: p95
            job: gateway-small-gpt-4o-openai-c8
          - pct: p99
            job: gateway-small-gpt-4o-openai-c8
          - pct: mean
            job: baseline-small-gpt-4o-openai-c8
          - pct: p90
            job: baseline-small-gpt-4o-openai-c8
          - pct: p95
            job: baseline-small-gpt-4o-openai-c8
          - pct: p99
            job: baseline-small-gpt-4o-openai-c8

      # guidellm benchmark: Request Latency (lower is better)
      - name: ${job}-request-latency-${pct}
        metricName.keyword: guidellmBenchmarkSummary
        job_name.keyword: ${job}
        metric_of_interest: request_latency_${pct}_seconds
        agg:
          agg_type: avg
        direction: 1
        threshold: 10
        fan_out:
          - pct: mean
            job: gateway-small-gpt-4o-openai-c8
          - pct: p90
            job: gateway-small-gpt-4o-openai-c8
          - pct: p95
            job: gateway-small-gpt-4o-openai-c8
          - pct: p99
            job: gateway-small-gpt-4o-openai-c8
          - pct: mean
            job: baseline-small-gpt-4o-openai-c8
          - pct: p90
            job: baseline-small-gpt-4o-openai-c8
          - pct: p95
            job: baseline-small-gpt-4o-openai-c8
          - pct: p99
            job: baseline-small-gpt-4o-openai-c8

      # guidellm benchmark: Output Tokens/sec (higher is better)
      - name: ${job}-output-tps-${pct}
        metricName.keyword: guidellmBenchmarkSummary
        job_name.keyword: ${job}
        metric_of_interest: output_tokens_per_second_${pct}
        agg:
          agg_type: avg
        direction: -1
        threshold: 10
        fan_out:
          - pct: mean
            job: gateway-small-gpt-4o-openai-c8
          - pct: p90
            job: gateway-small-gpt-4o-openai-c8
          - pct: p95
            job: gateway-small-gpt-4o-openai-c8
          - pct: p99
            job: gateway-small-gpt-4o-openai-c8
          - pct: mean
            job: baseline-small-gpt-4o-openai-c8
          - pct: p90
            job: baseline-small-gpt-4o-openai-c8
          - pct: p95
            job: baseline-small-gpt-4o-openai-c8
          - pct: p99
            job: baseline-small-gpt-4o-openai-c8

      # guidellm benchmark: Throughput RPS (higher is better)
      - name: ${job}-throughput-${pct}
        metricName.keyword: guidellmBenchmarkSummary
        job_name.keyword: ${job}
        metric_of_interest: throughput_${pct}_rps
        agg:
          agg_type: avg
        direction: -1
        threshold: 10
        fan_out:
          - pct: mean
            job: gateway-small-gpt-4o-openai-c8
          - pct: p90
            job: gateway-small-gpt-4o-openai-c8
          - pct: p95
            job: gateway-small-gpt-4o-openai-c8
          - pct: p99
            job: gateway-small-gpt-4o-openai-c8
          - pct: mean
            job: baseline-small-gpt-4o-openai-c8
          - pct: p90
            job: baseline-small-gpt-4o-openai-c8
          - pct: p95
            job: baseline-small-gpt-4o-openai-c8
          - pct: p99
            job: baseline-small-gpt-4o-openai-c8

      # guidellm benchmark: Error count (lower is better)
      - name: ${job}-errored-requests
        metricName.keyword: guidellmBenchmarkSummary
        job_name.keyword: ${job}
        metric_of_interest: errored_requests
        agg:
          agg_type: sum
        direction: 1
        fan_out:
          - job: gateway-small-gpt-4o-openai-c8
          - job: baseline-small-gpt-4o-openai-c8
